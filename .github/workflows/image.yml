name: image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/karasvladyslav/homelab-atlas

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Syntax check
        run: |
          node --check src/model.js
          node --check src/scene.js
          node --check src/editor.js
          node --check src/yamledit.js

      # Same check deployments run on their own inventories (schema + references + IPs).
      - name: Validate example inventory
        run: |
          npm ci
          node tools/validate.mjs config/inventory.yaml
          node tools/test-yamledit.mjs

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: homelab-atlas:test

      # Smoke test the real image: nginx serves the page, and a headless browser actually
      # renders the scene (boxes on the hardware floor, node outlines on the network floor).
      - name: Render inside the image
        run: |
          docker run -d --name atlas -p 8080:8080 homelab-atlas:test
          for i in $(seq 1 20); do curl -fs http://localhost:8080/healthz && break; sleep 0.5; done
          curl -fsI http://localhost:8080/config/inventory.yaml | grep -i 'cache-control: no-cache'
          dom=$(google-chrome --headless=new --no-sandbox --virtual-time-budget=3000 --dump-dom http://localhost:8080/)
          nodes=$(grep -o 'class="node"' <<<"$dom" | wc -l)
          netnodes=$(grep -o 'class="netnode"' <<<"$dom" | wc -l)
          echo "rendered: $nodes boxes, $netnodes network nodes"
          test "$nodes" -gt 0 && test "$netnodes" -gt 0

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Immutable tag = commit sha; deployments pin it.
      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
