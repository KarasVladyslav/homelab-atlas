server {
    listen 8080;
    root /usr/share/nginx/html;

    # File names carry no version hash, so never let a browser reuse a file without asking:
    # no-cache = revalidate every time (ETag → a cheap 304 when unchanged). Without it browsers
    # cache heuristically and can mix a new index.html with an old script.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # The inventory changes without a new image (mounted config) — never let a browser keep a stale one.
    location /config/ {
        add_header Cache-Control "no-cache";
        default_type text/yaml;   # nginx has no type for .yaml
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
