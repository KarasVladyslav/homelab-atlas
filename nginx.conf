server {
    listen 8080;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ =404;
    }

    # The inventory changes without a new image (mounted config) — never let a browser keep a stale one.
    location /config/ {
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
