<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>homelab-atlas</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <header class="bar">
    <span class="brand">homelab-atlas <span class="title" id="title"></span></span>
  </header>

  <main class="stage" id="stage" data-floor="hardware">
    <div class="scene" id="scene"></div>

    <!-- Editing tools: left. Navigation: right (camera cube top, floor slider middle). -->
    <div class="toolbar" role="toolbar" aria-label="Editing">
      <button type="button" id="edit-toggle" class="tool" aria-pressed="false" title="Edit (plan and hardware floors)">✎<span class="sr-only">Edit</span></button>
      <button type="button" id="save" class="tool save" hidden title="Save inventory.yaml">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M4 4h12l4 4v12H4z M8 4v5h7V4 M7 20v-6h10v6"/></svg>
        <span class="sr-only">Save</span>
      </button>
    </div>

    <div class="nav">
      <div class="cube-wrap" id="cube" title="Click a face or a corner to look from there · drag to orbit"></div>
      <button type="button" class="tool home" id="home" title="Reset the view">⌂<span class="sr-only">Reset view</span></button>
    </div>

    <div class="floors" id="floors" role="slider" tabindex="0" aria-label="Floor" aria-orientation="vertical"></div>

    <div class="legend" id="legend" aria-label="Networks"></div>
    <div class="problems" id="problems" hidden aria-live="polite"></div>
    <div class="toast" id="toast" aria-live="polite"></div>
  </main>

  <!-- No build step: plain scripts. The inventory (config/inventory.yaml) is fetched, so the page
       needs to be served over http (any static server will do). -->
  <script src="src/vendor/yaml.min.js"></script>
  <script src="src/yamledit.js"></script>
  <script src="src/model.js"></script>
  <script src="src/scene.js"></script>
  <script src="src/editor.js"></script>
</body>
</html>
