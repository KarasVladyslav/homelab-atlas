<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>homelab-atlas</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <header class="bar">
    <span class="brand">homelab-atlas <span class="title" id="title"></span></span>
    <div class="controls">
      <div class="toggle" role="group" aria-label="Floor">
        <button type="button" data-floor="hardware" aria-pressed="true">Hardware</button>
        <button type="button" data-floor="network" aria-pressed="false">Network</button>
      </div>
      <div class="toggle" role="group" aria-label="Camera">
        <button type="button" data-view="top" aria-pressed="false">Top</button>
        <button type="button" data-view="side" aria-pressed="true">Side</button>
      </div>
    </div>
  </header>

  <main class="stage side" id="stage">
    <div class="scene" id="scene"></div>
    <div class="legend" id="legend" aria-label="Networks"></div>
    <div class="problems" id="problems" hidden aria-live="polite"></div>
  </main>

  <!-- No build step: plain scripts. The inventory (config/inventory.yaml) is fetched, so the page
       needs to be served over http (any static server will do). -->
  <script src="src/vendor/js-yaml.min.js"></script>
  <script src="src/model.js"></script>
  <script src="src/scene.js"></script>
</body>
</html>
